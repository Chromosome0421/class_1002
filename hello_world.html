<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World - 美好的一天</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 p-6 selection:bg-indigo-500 selection:text-white relative overflow-hidden">

  <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>

  <main class="relative z-10 w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 shadow-2xl transition-all duration-300 hover:shadow-indigo-500/10">
  <!-- 右上角氛圍切換按鈕 -->
  <button 
    id="btn-theme"
    type="button"
    class="fixed top-6 right-6 z-50 flex items-center gap-2 py-2.5 px-4 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 text-slate-200 text-sm font-medium backdrop-blur-xl border border-white/20 shadow-lg shadow-black/20 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-white/30 cursor-pointer">
    切換氛圍 🎨
  </button>


    <div class="flex flex-col items-center text-center space-y-6">
      
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 text-xs font-medium tracking-wide">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        歡迎來到網頁世界
      </div>

      <div class="space-y-2">
        <h1 id="greeting-title" class="text-4xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-200 via-purple-200 to-pink-200 bg-clip-text text-transparent transition-all duration-300">
          Hello, World!
        </h1>
        <p id="greeting-desc" class="text-slate-300 text-sm sm:text-base leading-relaxed">
          程式旅程的第一步。願你的程式碼無 bug，每一天都充滿靈感與收穫！
        </p>
      </div>

      <div class="w-full flex flex-col sm:flex-row gap-3 pt-2">
        <button 
          id="btn-interact"
          type="button"
          class="flex-1 py-3 px-5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-medium text-sm transition-all duration-200 shadow-lg shadow-indigo-600/30 focus:outline-none focus:ring-2 focus:ring-indigo-400/50">
          點我打個招呼 ✨
        </button>
        <button 
          id="btn-lang"
          type="button"
          class="py-3 px-4 rounded-2xl bg-white/10 hover:bg-white/15 active:scale-95 text-slate-200 font-medium text-sm border border-white/10 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-white/20">
          切換語言 🌐
        </button>

      </div>

      <div id="message-box" class="h-10 flex items-center justify-center text-xs sm:text-sm text-indigo-200 transition-opacity duration-300 opacity-0 font-medium">
        <!-- 動態訊息插入處 -->
      </div>
      
    </div>
  </main>

  <script>
    // 取得 DOM 節點
    const btnInteract = document.getElementById('btn-interact');
    const btnTheme = document.getElementById('btn-theme');
    const btnLang = document.getElementById('btn-lang');

    const greetingTitle = document.getElementById('greeting-title');
    const messageBox = document.getElementById('message-box');
    const body = document.body;

    // 互動訊息清單
    const messages = [
      "你小子 又在打原神",
      "今天也是充滿可能性的美好一天！🚀",
      "保持好奇心，持續學習新技術！💻",
      "Hello again, Explorer! ✨"
    ];
    let messageIndex = 0;

    // 主題漸層色彩清單
    const themes = [
      'from-slate-900 via-indigo-950 to-slate-900',
      'from-emerald-950 via-teal-950 to-slate-900',
      'from-rose-950 via-purple-950 to-slate-900',
      'from-amber-950 via-stone-900 to-slate-950'
    ];
    let themeIndex = 0;

    // 5 種語言的 Hello World 清單
    const languages = [
      "Hello, World!",       // 英文
      "你好，世界！",         // 中文
      "こんにちは、世界！",   // 日文
      "안녕하세요, 세계!",     // 韓文
      "Bonjour le monde !"   // 法文
    ];
    let langIndex = 0;

    // 切換語言按鈕事件
    btnLang.addEventListener('click', () => {
      langIndex = (langIndex + 1) % languages.length;
      greetingTitle.textContent = languages[langIndex];

      // 切換時的微動效
      greetingTitle.classList.add('scale-105');
      setTimeout(() => {
        greetingTitle.classList.remove('scale-105');
      }, 200);
    });


    // 打招呼按鈕事件
    btnInteract.addEventListener('click', () => {
      messageBox.textContent = messages[messageIndex];
      messageBox.classList.remove('opacity-0');
      messageBox.classList.add('opacity-100');
      
      messageIndex = (messageIndex + 1) % messages.length;

      // 標題彈跳微動效
      greetingTitle.classList.add('scale-105');
      setTimeout(() => {
        greetingTitle.classList.remove('scale-105');
      }, 200);
    });

    // 切換主題氛圍事件
    btnTheme.addEventListener('click', () => {
      // 移除目前漸層樣式
      themes.forEach(t => body.classList.remove(...t.split(' ')));
      
      // 切換下一個漸層樣式
      themeIndex = (themeIndex + 1) % themes.length;
      body.classList.add(...themes[themeIndex].split(' '));
    });
  </script>
</body>
</html>
